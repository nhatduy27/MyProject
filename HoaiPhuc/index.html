<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoài Phúc</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #e5eda5;
    font-family: 'Arial', sans-serif;
    flex-direction: column;
  }

  .container {
    text-align: center;
    padding: 20px;
  }

  h1 {
    font-size: 2.3em;
    color: #f32424;
  }

  .buttons {
    margin-top: 20px;
  }

  .yes-button {
    font-size: 1.5em;
    padding: 10px 20px;
    margin-right: 10px;
    background-color: #29b6f6;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  .no-button {
    font-size: 1.5em;
    padding: 10px 20px;
    background-color: #ff9800;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  .gif_container img {
    max-width: 100%;
    height: auto;
    border-radius: 10px;
    margin-top: 20px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Hoài Phúc có dễ thương không?</h1>
    <div class="buttons">
      <button class="yes-button" onclick="handleYesClick()">Có nhaa</button>
      <button class="no-button" onclick="handleNoClick()">Không nha</button>
    </div>
    <div class="gif_container">
      <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExcnA4MDV4c3NraXk4Y3lob2t5Nm5zdmhzdzkyZGYwaWlwaWxzNTlvbyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/wYzNWKJ2jU4rNX6SAO/giphy.gif" alt="Cute GIF">
    </div>
  </div>

<script>
const messages = [
    "Anh thấy cũng cũng mà 🥲",
    "Không suy nghĩ lại 1 chút được sao",
    "Đổi ý đi trời",
    "👍👍👍",
    "Anh không nói quài đâu nha",
    "Lì thiệt chứ"
];

let messageIndex = 0;

const gifList = [
    "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExMWxlcGRweTM0NzkybjQ3bHhmYWdmbjd3ZHhxeGJzY2l2OTA5djhwYSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/VM1fcpu2bKs1e2Kdbj/giphy.gif",
    "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExYmc0ZzY3M2Y1ZnRqYmVpd3FncGI1cTFoaXM0aHB2b3ZtM3diOXVvdiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/iapHPgb3funNMt4OCO/giphy.gif",
    "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExOWZvbWNmb2FlbnV1YXNhcDRxczdiZno4Y3FpbDBnd2Y4OWhwazRpeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/UmthO5muTl9jh0GcDQ/giphy.gif",
    "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExMzgydHppeW5kZDJ4eGFreWpieWR5dGdkaW91d2VzaDVmZ3ZraTN0aiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/QlQdLBS70XJcZY1fLF/giphy.gif"
];

let gifIndex = 0;

function handleNoClick() {
    const noButton = document.querySelector('.no-button');
    const yesButton = document.querySelector('.yes-button');
    noButton.textContent = messages[messageIndex];
    messageIndex = (messageIndex + 1) % messages.length;
    const currentSize = parseFloat(window.getComputedStyle(yesButton).fontSize);
    yesButton.style.fontSize = `${currentSize * 1.5}px`;

    const gifImg = document.querySelector('.gif_container img');
    gifIndex = (gifIndex + 1) % gifList.length;
    gifImg.src = gifList[gifIndex];
}

function handleYesClick() {
    window.location.href = "yes_page.html";
}
</script>
</body>
</html>
