<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lật thẻ trí nhớ</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background-color: #FFFF8F;
    font-family: 'Arial', sans-serif;
    flex-direction: column;
  }

  h1 {
    font-size: 2em;
    color: #f32424;
    text-align: center;
    margin-bottom: 10px;
  }

  .info {
    margin-bottom: 20px;
    font-size: 1.1em;
    color: #555;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 90px);
    grid-template-rows: repeat(2, 90px);
    gap: 12px;
  }

  .card {
    width: 90px;
    height: 90px;
    background-color: #29b6f6;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2.2em;
    cursor: pointer;
    user-select: none;
    transition: transform 0.2s ease, background-color 0.2s ease;
  }

  .card.flipped {
    background-color: white;
    border: 2px solid #29b6f6;
    transform: scale(1.05);
  }

  .card.matched {
    background-color: #ff9800;
    border: none;
    cursor: default;
  }

  /* Popup */
  .overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
  }

  .overlay.show {
    display: flex;
  }

  .popup {
    background: #FFFF8F;
    padding: 30px 40px;
    border-radius: 15px;
    text-align: center;
    max-width: 320px;
  }

  .popup h2 {
    color: #f32424;
    font-size: 1.6em;
    margin-top: 0;
  }

  .popup button {
    margin-top: 15px;
    font-size: 1.2em;
    padding: 10px 25px;
    background-color: #29b6f6;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>Chơi lật thẻ đã nhaa</h1>
  <div class="info">Số lượt lật: <span id="moves">0</span></div>
  <div class="board" id="board"></div>

  <div class="overlay" id="overlay">
    <div class="popup">
      <h2>Ẻm cũng giỏi đó chứ hì 🎉</h2>
      <p>Trước khi lấy quà thì trả lời đúng câu hỏi của anh đã</p>
      <button onclick="goToWinner()">Mở câu hỏi deeeeee</button>
    </div>
  </div>

<script>
const icons = ["♥️", "👍", "🌺", "🎂"];
let cardValues = [...icons, ...icons];

// Xáo trộn thẻ
cardValues.sort(() => Math.random() - 0.5);

const board = document.getElementById('board');
const movesEl = document.getElementById('moves');
const overlay = document.getElementById('overlay');

let flippedCards = [];
let matchedCount = 0;
let moves = 0;
let lock = false;

cardValues.forEach((value, index) => {
  const card = document.createElement('div');
  card.classList.add('card');
  card.dataset.value = value;
  card.dataset.index = index;
  card.addEventListener('click', () => flipCard(card));
  board.appendChild(card);
});

function flipCard(card) {
  if (lock) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (flippedCards.length === 2) return;

  card.textContent = card.dataset.value;
  card.classList.add('flipped');
  flippedCards.push(card);

  if (flippedCards.length === 2) {
    moves++;
    movesEl.textContent = moves;
    lock = true;

    const [first, second] = flippedCards;
    if (first.dataset.value === second.dataset.value) {
      setTimeout(() => {
        first.classList.add('matched');
        second.classList.add('matched');
        matchedCount += 2;
        flippedCards = [];
        lock = false;
        if (matchedCount === cardValues.length) {
          setTimeout(showWinPopup, 400);
        }
      }, 500);
    } else {
      setTimeout(() => {
        first.textContent = '';
        second.textContent = '';
        first.classList.remove('flipped');
        second.classList.remove('flipped');
        flippedCards = [];
        lock = false;
      }, 800);
    }
  }
}

function showWinPopup() {
  overlay.classList.add('show');
}

function goToWinner() {
  window.location.href = "question.html";
}
</script>
</body>
</html>
