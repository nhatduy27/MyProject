<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #FFFF8F;
            font-family: 'Arial', sans-serif;
            padding: 16px;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .header_text {
            font-size: 2.6em;
            color: #c01515;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .gif_container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .gif_container img {
            width: 45%;
            max-width: 500px;
            height: auto;
            border-radius: 15px;
        }

        @media (max-width: 600px) {
            .header_text {
                font-size: 1.7em;
            }

            .gif_container img {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header_text">Tặng em 🖊️ Đừng bẻ nhaaa</h1>

        <div class="gif_container">
            <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExNWl6bGJrOGpnbDNxYTJnOXUzdzlvMzVhZTN5OG1wOGtyNmJscWZtZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/sWBzg2D15WwQjHcxbt/giphy.gif" alt="Gif 1">
        </div>
    </div>
</body>
</html>
