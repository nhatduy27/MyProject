<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,user-scalable=no" />
<title>3D Carousel</title>
</head>
<body>
<div id="drag-container">
  <div id="spin-container">
    <img src="../images/kim.jpg" alt="" />
    <img src="../images/kim2.jpg" alt="" />
    <img src="../images/kim3.jpg" alt="" />
    <img src="../images/kim4.jpg" alt="" />
    <img src="../images/kim5.jpg" alt="" />
    <img src="../images/kim6.jpg" alt="" />
    <img src="../images/kim7.jpg" alt="" />
    <img src="../images/kim8.jpg" alt="" />
    <img src="../images/kim9.jpg" alt="" />
    <img src="../images/kim10.jpg" alt="" />
    <p> ❤️❤️❤️ </p>
  </div>
  <div id="ground"></div>
</div>

<!-- Floating hearts -->
<div id="hearts-container"></div>

<style>
* { margin: 0; padding: 0; }

html, body {
  height: 100%;
  touch-action: none;
}

body {
  overflow: hidden;
  display: flex;
  /* Nền hồng nhạt gradient nhẹ */
  background: linear-gradient(135deg, #ffe4ef 0%, #ffd6e8 40%, #fce4ec 70%, #ffe8f0 100%);
  perspective: 1000px;
  transform-style: preserve-3d;
  font-family: 'Georgia', serif;
}

/* Hiệu ứng shimmer nhẹ ở nền */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 30% 20%, rgba(255,182,193,0.3) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 80%, rgba(255,160,180,0.2) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

#drag-container,
#spin-container {
  position: relative;
  display: flex;
  margin: auto;
  transform-style: preserve-3d;
  transform: rotateX(-10deg);
  z-index: 1;
}

#drag-container img,
#drag-container video {
  transform-style: preserve-3d;
  position: absolute;
  left: 0; top: 0;
  width: 100%; height: 100%;
  line-height: 200px;
  font-size: 50px;
  text-align: center;
  border-radius: 12px;
  /* Viền hồng nhẹ */
  box-shadow: 0 0 10px rgba(255,105,135,0.4), 0 0 2px #fff8;
  -webkit-box-reflect: below 10px linear-gradient(transparent, transparent, rgba(255,182,193,0.25));
  transition: box-shadow 0.3s ease;
}

#drag-container img:hover,
#drag-container video:hover {
  box-shadow: 0 0 22px rgba(255,80,120,0.7), 0 0 6px #ffb6c1;
  -webkit-box-reflect: below 10px linear-gradient(transparent, transparent, rgba(255,150,180,0.4));
}

#drag-container p {
  font-family: 'Georgia', serif;
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translate(-50%, -50%) rotateX(90deg);
  color: #c2185b;
  font-size: 18px;
  letter-spacing: 2px;
  text-shadow: 0 0 10px rgba(255,100,150,0.6);
  white-space: nowrap;
}

#ground {
  width: 900px;
  height: 900px;
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translate(-50%, -50%) rotateX(90deg);
  background: radial-gradient(center center, farthest-side, rgba(255,182,193,0.35), transparent);
}

/* ===== Floating hearts ===== */
#hearts-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.heart {
  position: absolute;
  bottom: -40px;
  font-size: 18px;
  opacity: 0;
  animation: floatUp linear infinite;
  user-select: none;
}

@keyframes floatUp {
  0%   { opacity: 0;   transform: translateY(0) scale(0.8); }
  10%  { opacity: 0.7; }
  80%  { opacity: 0.4; }
  100% { opacity: 0;   transform: translateY(-100vh) scale(1.2) rotate(20deg); }
}

/* ===== Spin animations ===== */
@keyframes spin {
  from { transform: rotateY(0deg); }
  to   { transform: rotateY(360deg); }
}
@keyframes spinRevert {
  from { transform: rotateY(360deg); }
  to   { transform: rotateY(0deg); }
}
</style>

<script>
// Config
var radius      = 240;
var autoRotate  = true;
var rotateSpeed = -60;
var imgWidth    = 120;
var imgHeight   = 170;

setTimeout(init, 100);

var odrag = document.getElementById("drag-container");
var ospin = document.getElementById("spin-container");
var aImg  = ospin.getElementsByTagName("img");
var aVid  = ospin.getElementsByTagName("video");
var aEle  = [...aImg, ...aVid];

ospin.style.width  = imgWidth  + "px";
ospin.style.height = imgHeight + "px";

var ground = document.getElementById("ground");
ground.style.width  = radius * 3 + "px";
ground.style.height = radius * 3 + "px";

function init(delayTime) {
  for (var i = 0; i < aEle.length; i++) {
    aEle[i].style.transform =
      "rotateY(" + i * (360 / aEle.length) + "deg) translateZ(" + radius + "px)";
    aEle[i].style.transition = "transform 1s";
    aEle[i].style.transitionDelay = delayTime || (aEle.length - i) / 4 + "s";
  }
}

function applyTranform(obj) {
  if (tY > 180) tY = 180;
  if (tY < 0)   tY = 0;
  obj.style.transform = "rotateX(" + -tY + "deg) rotateY(" + tX + "deg)";
}

function playSpin(yes) {
  ospin.style.animationPlayState = yes ? "running" : "paused";
}

var sX, sY, nX, nY, desX = 0, desY = 0, tX = 0, tY = 10;

if (autoRotate) {
  var animName = rotateSpeed > 0 ? "spin" : "spinRevert";
  ospin.style.animation = animName + " " + Math.abs(rotateSpeed) + "s infinite linear";
}

document.onpointerdown = function(e) {
  clearInterval(odrag.timer);
  e = e || window.event;
  var sX = e.clientX, sY = e.clientY;
  this.onpointermove = function(e) {
    e = e || window.event;
    var nX = e.clientX, nY = e.clientY;
    desX = nX - sX; desY = nY - sY;
    tX += desX * 0.1; tY += desY * 0.1;
    applyTranform(odrag);
    sX = nX; sY = nY;
  };
  this.onpointerup = function(e) {
    odrag.timer = setInterval(function() {
      desX *= 0.95; desY *= 0.95;
      tX += desX * 0.1; tY += desY * 0.1;
      applyTranform(odrag);
      playSpin(false);
      if (Math.abs(desX) < 0.5 && Math.abs(desY) < 0.5) {
        clearInterval(odrag.timer);
        playSpin(true);
      }
    }, 17);
    this.onpointermove = this.onpointerup = null;
  };
  return false;
};

document.onmousewheel = function(e) {
  e = e || window.event;
  var d = e.wheelDelta / 20 || -e.detail;
  radius += d;
  init(1);
};

// === Floating hearts ===
var heartsEl  = document.getElementById("hearts-container");
var heartSyms = ["🩷","💕","🌸","✨","💗","🌷","💖"];

function spawnHeart() {
  var h = document.createElement("span");
  h.className   = "heart";
  h.textContent = heartSyms[Math.floor(Math.random() * heartSyms.length)];
  h.style.left     = Math.random() * 100 + "vw";
  h.style.fontSize = (12 + Math.random() * 14) + "px";
  var dur = 6 + Math.random() * 7;
  h.style.animationDuration = dur + "s";
  h.style.animationDelay    = Math.random() * 3 + "s";
  heartsEl.appendChild(h);
  setTimeout(function() { h.remove(); }, (dur + 3) * 1000);
}

// Spawn hearts periodically
setInterval(spawnHeart, 800);
// Spawn a few immediately
for (var i = 0; i < 6; i++) spawnHeart();
</script>
</body>
</html>
